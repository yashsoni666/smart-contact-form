<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Message Analysis</h2>

        <p style="color:white; text-align:center;">{{ message }}</p>

        {% if result == "spam" %}
            <div class="spam">🚫 SPAM DETECTED</div>
        {% else %}
            <div class="ham">✅ GENUINE MESSAGE</div>
        {% endif %}

        <a href="/">Go Back</a>
        <a href="/history">📊 View History</a>
    </div>
</body>
</html>
